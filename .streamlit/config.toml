# Streamlit theme — drives the NATIVE widget accent (buttons, radio, slider, checkbox, links) that
# CSS cannot reliably override. Matches the design tokens in src/app/ui.py (_THEME_CSS).
[theme]
primaryColor = "#4F46E5"              # indigo — interactive accent (was Streamlit's default coral)
backgroundColor = "#F6F7F9"           # slate canvas (main content area)
secondaryBackgroundColor = "#FFFFFF"  # white — sidebar, form + widget inputs (cards)
textColor = "#0F172A"                 # slate-900 ink
font = "sans serif"

[browser]
gatherUsageStats = false
